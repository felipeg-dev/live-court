<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Court</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: arena noturna — placar de ginásio no topo, quadra vista de cima no centro, banco e controles embaixo */
:root{
  --arena:#0C1626; --arena-2:#12203A; --panel:#172A49; --panel-2:#1E365C; --line:#2B4470;
  --ink:#EEF3FA; --ink-2:#AFC0DA; --ink-3:#7489AB;
  --court:#D9743C; --court-2:#C86632; --free:#1B4C78; --courtline:#FFF5E6;
  --gold:#FFD15C; --danger:#FF6B6B; --ok:#5EE0A0; --gh:#8DB8FF; --gm:#FF9FCB;
  --f-score:'Big Shoulders Display','Barlow Condensed',Impact,sans-serif;
  --f-ui:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--arena);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(1200px 500px at 50% -120px, #1D3A66 0%, transparent 70%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--arena)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--arena) 88%,transparent);backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:16px;padding-block:12px;margin-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-score);font-weight:900;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand svg{width:30px;height:30px}
.brand small{display:block;font-family:var(--f-ui);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--ink-3)}
.nav{position:relative;display:flex;gap:2px;margin-left:auto;background:var(--arena-2);border:1px solid var(--line);border-radius:14px;padding:4px;max-width:100%}
.nav-ind{position:absolute;top:0;left:0;width:0;height:0;border-radius:10px;background:var(--panel-2);box-shadow:inset 0 -2px 0 var(--gold);z-index:0;
  transition:transform .42s cubic-bezier(.3,1.35,.45,1),width .42s cubic-bezier(.3,1.35,.45,1),height .3s}
.nav.noanim .nav-ind{transition:none}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;border:0;background:none;padding:9px 14px;border-radius:10px;font-family:var(--f-ui);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;transition:color .25s}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ni{color:var(--gold);transform:translateY(-1px) scale(1.08)}
.nav .ni{width:18px;height:18px;flex:none;transition:transform .3s,color .3s}
.nav .dotslot:empty{display:none}
.nav .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);animation:blink 1.4s infinite}
/* perfil do jogador */
.plink{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:2px 0;color:var(--ink);font:inherit;text-align:left;min-width:0;cursor:pointer}
.plink:hover b,.plink:hover span:not(.gtag){text-decoration:underline;text-underline-offset:3px}
button.fp{border:0;color:var(--ink);cursor:pointer}
button.fp:hover{background:var(--panel-2)}
.dcol li .plink{flex:1;overflow:hidden}
.dcol li .plink span:not(.gtag){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.pav{width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-score);font-weight:900;font-size:36px;background:var(--panel-2);color:var(--ink);box-shadow:0 0 0 4px var(--arena),0 0 0 7px var(--gold);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.pav.gh{box-shadow:0 0 0 4px var(--arena),0 0 0 7px var(--gh)} .pav.gm{box-shadow:0 0 0 4px var(--arena),0 0 0 7px var(--gm)}
.phead h1{overflow-wrap:anywhere}
.phead .sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi .ks{display:block;font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.3}
.chartbox{background:var(--arena-2);border:1px solid var(--line);border-radius:16px;padding:12px 8px 4px;overflow:hidden}
.pchart{display:block;max-width:100%;height:auto}
.pchart .ct{font-family:var(--f-ui);font-size:12px;font-weight:600;fill:var(--ink-3);letter-spacing:.04em}
.pchart .ct.w{fill:var(--ink)}
.pchart .ct.sm{font-size:10.5px;font-weight:500}
.pchart .ct.avg{fill:var(--ink-2)}
.pchart .bar{transition:opacity .15s}
.pchart .hit{cursor:pointer}
.pchart .hit:hover{fill:rgba(255,255,255,.04)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;box-shadow:0 10px 24px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:2px;max-width:240px}
#tip b{font-family:var(--f-score);font-size:20px}
#tip .pc{margin:0}
.pcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.h3{font-family:var(--f-ui);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.kbars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.kbars li{display:grid;grid-template-columns:7.2em 1fr 2.2em 2.8em;align-items:center;gap:8px;font-size:14px}
.kbars .kl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbars .kt{height:10px;border-radius:5px;background:var(--panel)}
.kbars .kt i{display:block;height:100%;border-radius:5px;background:var(--gold);min-width:2px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.kbars b{font-family:var(--f-score);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.kbars .pc{text-align:right;margin:0}
.plist2{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist2 li{display:flex;align-items:center;gap:8px;font-size:14px}
.plist2 .plink{flex:1;min-width:0}
.plist2 .plink .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.plist2 b{font-family:var(--f-score);font-size:18px;min-width:3ch;text-align:right}
.plist2 .pc{margin:0;white-space:nowrap}
.glist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.gitem{width:100%;display:flex;align-items:center;gap:10px;background:var(--arena-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left;color:var(--ink)}
.gitem:hover{border-color:var(--gold)}
.gitem .mascot{width:34px;height:34px;flex:none}
.gitem .gt{flex:1;min-width:0;display:flex;flex-direction:column}
.gitem .gt b{font-family:var(--f-score);font-size:18px;text-transform:uppercase;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitem .gt .pc{margin:0}
.gitem .gp{display:flex;flex-direction:column;align-items:flex-end}
.gitem .gp b{font-family:var(--f-score);font-size:24px;line-height:1}
.gitem .gp .pc{margin:0}
.res{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-family:var(--f-score);font-weight:900;font-size:17px;background:var(--panel);color:var(--ink-2)}
.res.w{background:color-mix(in srgb,var(--ok) 22%,var(--panel));color:var(--ok)}
.res.l{background:color-mix(in srgb,var(--danger) 18%,var(--panel));color:#FFB0B0}
@media (max-width:900px){ .kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))} .pcols{grid-template-columns:1fr 1fr} }
@media (max-width:700px){ .pcols{grid-template-columns:1fr} .pav{width:64px;height:64px;font-size:28px} .glist{grid-template-columns:1fr} }
.note.off{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--ink-3) 14%,var(--arena-2));border-color:var(--line);color:var(--ink-2)}
.note.off b{color:var(--ink)}
.offdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ink-3);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink-3) 30%,transparent)}
/* ajustar posições */
.hint.edit{flex-direction:column;align-items:stretch;gap:10px;background:color-mix(in srgb,var(--gold) 12%,var(--arena-2));color:var(--ink)}
.hint.edit .et{display:flex;flex-direction:column;gap:2px}
.hint.edit .et b:first-child{font-family:var(--f-ui);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-size:14px}
.hint.edit .row{justify-content:flex-end}
.court-wrap.editing{box-shadow:0 0 0 3px var(--gold) inset}
.court-wrap.editing .chip{animation:wob 1.6s ease-in-out infinite}
.court-wrap.editing .cell:nth-child(2n) .chip{animation-delay:-.8s}
.court-wrap.editing .chip.pick{animation:none;transform:scale(1.12);outline:4px solid var(--gold);outline-offset:3px}
.court-wrap.editing .chip.empty{cursor:pointer;border-color:rgba(255,245,230,.75)}
.court-wrap.editing .chip.drop{box-shadow:0 0 0 3px rgba(255,209,92,.45),0 6px 0 rgba(0,0,0,.28)}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.bchip.pick{outline:3px solid var(--gold);outline-offset:2px}
.bchip.drop{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.bchip.target{border-style:dashed;color:var(--gold);background:none}
.bench.editing{border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.late{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.late .pc{margin:0}
.roster-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.rcard{width:100%;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;background:var(--arena-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink)}
.rcard:hover{border-color:var(--gold)}
.rcard .gtag{grid-row:1/3}
.rcard .rn{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .pmeta{grid-column:2}
.chip:disabled{cursor:default}
.chip:disabled:hover{transform:none}
.bchip:disabled{cursor:default;color:var(--ink)}
#acct:empty{display:none}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--arena-2);border-radius:999px;padding:4px 12px 4px 4px;font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);min-height:40px}
.acct .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);color:var(--ink);font-family:var(--f-score);font-size:17px}
.acct .av svg{width:15px;height:15px}
.acct.on{color:var(--ink);border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.acct.on .av{background:var(--gold);color:var(--arena)}
.login{text-align:left}
.login h2,.login .eyebrow{text-align:center}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld input{background:var(--arena);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;width:100%;box-sizing:border-box}
.fld input:focus{border-color:var(--gold);outline:none}
.lerr{min-height:20px;margin:0 0 4px;font-size:14px;color:var(--gold)}
.linkbtn{display:block;margin:12px auto 0;background:none;border:0;color:var(--ink-3);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.hint.spect{background:color-mix(in srgb,var(--ok) 10%,var(--arena-2));border-color:color-mix(in srgb,var(--ok) 40%,var(--line));color:var(--ink-2)}
.ldot{width:9px;height:9px;border-radius:50%;background:var(--danger);animation:blink 1.4s infinite;flex:none}
main > section.in-r{animation:inR .38s cubic-bezier(.2,.9,.3,1)}
main > section.in-l{animation:inL .38s cubic-bezier(.2,.9,.3,1)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}}
@keyframes blink{50%{opacity:.25}}
.note{background:#3A2A12;border:1px solid #7A5A22;color:var(--gold);padding:8px 12px;border-radius:10px;margin-bottom:14px;font-size:14px}

/* blocos comuns */
.pane-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--f-score);font-weight:800;font-size:clamp(30px,4vw,42px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--ink-2);margin:6px 0 0;max-width:60ch}
.lbl{font-family:var(--f-ui);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:10px;font-family:var(--f-ui);font-weight:600;font-size:16px;letter-spacing:.03em;display:inline-flex;align-items:center;gap:8px;transition:background .15s,transform .1s}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.btn{min-height:42px;justify-content:center;text-align:center;line-height:1.15}
.btn.sm{padding:6px 11px;font-size:14.5px;min-height:34px}
.btn.ghost{background:none}
.btn.warn{border-color:#7A3434;color:#FFB0B0}
.btn.on{background:var(--gold);color:var(--arena);border-color:var(--gold)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.cta{border:0;background:var(--gold);color:var(--arena);padding:14px 22px;border-radius:12px;font-family:var(--f-score);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 5px 0 #B98E1E;transition:transform .1s, box-shadow .1s}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #B98E1E}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--arena-2);border:1px solid var(--line);border-radius:16px;padding:16px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--ink-2)}
.empty strong{display:block;font-family:var(--f-score);font-size:26px;color:var(--ink);text-transform:uppercase;margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* jogadores */
.add{display:flex;gap:10px;margin-bottom:6px}
.addhint{font-size:13px;color:var(--ink-3);margin:0 2px 14px;max-width:80ch}
.addhint b{color:var(--ok);font-weight:600}
.gtag{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;font-family:var(--f-ui);font-weight:700;font-size:12px;line-height:1;color:var(--arena);flex:none;vertical-align:middle}
.gtag.gh{background:var(--gh)} .gtag.gm{background:var(--gm)} .gtag.gx{background:var(--line);color:var(--ink-2)}
.gbtn{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 8px;font-family:var(--f-ui);font-weight:600;font-size:13px;letter-spacing:.03em;flex:none}
.gbtn.gh{border-color:var(--gh);color:var(--gh)} .gbtn.gm{border-color:var(--gm);color:var(--gm)} .gbtn.gx{color:var(--ink-3);border-style:dashed}
.gsum{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-ui);font-weight:600;font-size:15px;margin-left:6px}
.warnx{color:var(--gold);font-size:13px}
.bname .bg{display:flex;align-items:center;gap:6px;background:none;border:0;width:auto;height:auto;padding:0;color:var(--ink);font-weight:600;border-radius:0}
.bname .bg:hover{background:none;color:var(--ink)}
.bulk{background:var(--arena-2);border:1px solid var(--gold);border-radius:14px;padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;animation:slidein .3s ease-out}
.bulk ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.bname{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;font-weight:600;font-size:14px}
.bname.old{opacity:.7}
.bname em{font-style:normal;font-size:11px;color:var(--ink-3);font-family:var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.bname button{background:none;border:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);padding:0}
.bname button:hover{background:#2A1A24;color:var(--danger)}
.bname svg{width:12px;height:12px}
.cta.sm{font-size:17px;padding:10px 16px;box-shadow:0 4px 0 #B98E1E}
.add input{flex:1;min-width:0;background:var(--arena-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.prow{display:flex;align-items:center;gap:6px;background:var(--arena-2);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 8px;transition:border-color .15s,background .15s}
.prow.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--arena-2))}
.pres{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:4px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;flex:none}
.prow.on .check{background:var(--ok);border-color:var(--ok)}
.prow.on .check::after{content:"";width:9px;height:5px;border-left:3px solid var(--arena);border-bottom:3px solid var(--arena);transform:rotate(-45deg) translate(1px,-1px)}
.pname{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:12.5px;color:var(--ink-3)}
.del{background:none;border:0;color:var(--ink-3);padding:6px 8px;border-radius:8px;font-size:13px}
.del:hover{color:var(--danger);background:#2A1A24}
.del svg{width:14px;height:14px;display:block}
.prow .del{width:34px;height:34px;display:grid;place-items:center;padding:0;flex:none}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px;color:#FFB0B0}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.count{font-family:var(--f-score);font-weight:800;font-size:22px}
.foot{display:flex;justify-content:flex-end;margin-top:20px}

/* times */
.teams{display:grid;grid-template-columns:1fr minmax(220px,.8fr) 1fr;gap:14px;align-items:start}
.tcol{background:var(--arena-2);border:1px solid var(--line);border-top:5px solid var(--tc);border-radius:16px;padding:14px;min-width:0}
.tcol-head{display:flex;align-items:center;gap:10px}
.tcol-head .mascot{width:64px;height:64px;flex:none}
.tname-in{flex:1;min-width:0;background:none;border:0;border-bottom:2px dashed var(--line);font-family:var(--f-score);font-weight:800;font-size:28px;text-transform:uppercase;padding:2px 0}
.tname-in:focus{border-bottom-color:var(--tc);outline:none}
.pickers{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.mpick{display:flex;gap:4px;flex-wrap:wrap}
.mpick button{width:42px;height:42px;padding:2px;border-radius:10px;border:2px solid transparent;background:var(--panel)}
.mpick button[aria-pressed="true"]{border-color:var(--tc);background:var(--panel-2)}
.mpick svg{width:100%;height:100%}
.cpick{display:flex;gap:6px;flex-wrap:wrap}
.cpick button{width:28px;height:28px;border-radius:50%;border:3px solid var(--arena-2);box-shadow:0 0 0 2px var(--line)}
.cpick button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.roster li{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:5px 6px 5px 6px}
.slot{flex:none;width:34px;text-align:center;font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--arena);background:var(--tc);border-radius:7px;padding:2px 0}
.slot.bench{background:var(--line);color:var(--ink-2)}
.roster .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ico{background:none;border:0;width:30px;height:30px;border-radius:8px;color:var(--ink-2);display:grid;place-items:center;flex:none}
.ico:hover{background:var(--panel-2);color:var(--ink)}
.ico svg{width:16px;height:16px}
.rhint{font-size:13px;color:var(--ink-3);margin:8px 2px 0}
.pool{background:var(--arena-2);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.pool ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.pool li{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:10px;padding:5px 5px 5px 10px}
.pool li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.to{border:0;border-radius:8px;padding:6px 10px;font-family:var(--f-ui);font-weight:700;font-size:15px;color:var(--arena);background:var(--tc)}
.draws{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.bench.rod{border-color:color-mix(in srgb,var(--tc) 55%,var(--line))}
.bchip.next{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 18%,var(--panel))}
.bchip em{display:block;font-style:normal;font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.feed li.swapl{opacity:.85;font-size:13px;background:color-mix(in srgb,var(--tc) 10%,var(--arena-2))}
.tswap{flex-basis:100%;font-size:13px;color:var(--ink-2)}
.nextnote{background:var(--panel);border-radius:12px;padding:10px 12px;margin:12px 0 0;text-align:left;font-size:14px;color:var(--ink-2)}
.nextnote .lbl{display:block;margin-bottom:2px}
.chip.enter{animation:enter .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes enter{0%{transform:translateY(40px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.cfg label{display:flex;flex-direction:column;gap:4px}
.cfg select{background:var(--arena-2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
.startbar{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}

/* placar */
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:14px}
.tb{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--panel),var(--arena-2));border:1px solid var(--line);border-radius:18px;padding:10px 14px;position:relative;overflow:hidden;min-width:0}
.tb::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--tc)}
.tb.B{flex-direction:row-reverse;text-align:right}
.tb.B::before{inset:0 0 0 auto}
.tb .mascot{width:64px;height:64px;flex:none}
.tinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tb.B .tinfo{align-items:flex-end}
.tname{font-family:var(--f-score);font-weight:800;font-size:clamp(18px,2.4vw,26px);text-transform:uppercase;line-height:1.2;padding-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.dots{display:flex;gap:5px}
.dots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--tc)}
.dots i.f{background:var(--tc)}
.adv{align-self:flex-start;border:1px solid color-mix(in srgb,var(--tc) 60%,transparent);background:color-mix(in srgb,var(--tc) 14%,transparent);border-radius:8px;padding:4px 9px;font-family:var(--f-ui);font-weight:600;font-size:13.5px;letter-spacing:.02em;white-space:nowrap}
.tb.B .adv{align-self:flex-end}
.score{font-family:var(--f-score);font-weight:900;font-size:clamp(54px,8vw,92px);line-height:.85;font-variant-numeric:tabular-nums;color:var(--ink);min-width:1.3em;text-align:center;display:inline-block}
.score.bump{animation:bump .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:translateY(-30%) scale(1.25);color:var(--tc)}100%{transform:none}}
.srow{display:flex;align-items:center;gap:10px;min-height:22px}
.tb.B .srow{flex-direction:row-reverse}
.srv{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-ui);font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tc)}
.serveflag{width:18px;height:18px;flex:none;animation:spin 3s linear infinite}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px;min-width:96px;text-align:center}
.mid .setn{font-family:var(--f-score);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase}
.mid .tgt{font-size:12.5px;color:var(--ink-3)}
.mid .hist{font-family:var(--f-ui);font-weight:600;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* quadra */
.court-wrap{background:var(--free);border-radius:22px;padding:clamp(14px,3vw,34px);position:relative;
  background-image:radial-gradient(circle at 50% 50%, #22598A 0%, var(--free) 70%)}
.court{position:relative;display:grid;margin:0 auto;background:var(--court);border:3px solid var(--courtline);border-radius:3px;
  background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.035) 46px 48px)}
.court.h{grid-template-columns:1fr 1fr;aspect-ratio:2/1;width:min(100%,calc((100dvh - 330px)*2));min-width:min(100%,560px)}
.court.v{grid-template-rows:1fr 1fr;aspect-ratio:9/15;width:100%;max-width:420px;background-image:repeating-linear-gradient(0deg,transparent 0 46px,rgba(0,0,0,.035) 46px 48px)}
.half{display:grid;place-items:center;position:relative;z-index:1;padding:2%}
.court.h .half{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr)}
.court.v .half{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.half::before{content:"";position:absolute;inset:0;background:var(--tc);opacity:.07;pointer-events:none}
.half.flash::before{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.5}100%{opacity:.07}}
.aline{position:absolute;background:var(--courtline);opacity:.9}
.court.h .aline{top:0;bottom:0;width:2px}
.court.v .aline{left:0;right:0;height:2px}
.net{position:absolute;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.85) 0 2px,transparent 2px 7px),repeating-linear-gradient(90deg,rgba(255,255,255,.85) 0 2px,transparent 2px 7px);
  background-color:rgba(12,22,38,.45);border:2px solid #fff;box-shadow:0 0 0 3px rgba(12,22,38,.35)}
.court.h .net{left:calc(50% - 6px);width:12px;top:-5%;bottom:-5%;border-radius:3px}
.court.v .net{top:calc(50% - 6px);height:12px;left:-5%;right:-5%;border-radius:3px}
.post{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;z-index:3}
.cell{display:grid;place-items:center;width:100%;height:100%;position:relative;z-index:3}
.chip{width:clamp(56px,7vw,84px);aspect-ratio:1;border-radius:50%;background:var(--tc);color:var(--arena);border:3px solid var(--courtline);
  display:grid;place-items:center;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.28),0 10px 18px rgba(0,0,0,.25);transition:transform .12s;padding:0;touch-action:manipulation}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.chip .nm{font-family:var(--f-ui);font-weight:700;font-size:clamp(12px,1.25vw,15.5px);line-height:1.05;text-transform:uppercase;letter-spacing:.02em;text-align:center;max-width:86%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .nm.long{font-size:clamp(10.5px,1vw,13px);letter-spacing:0}
.chip .pos{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;background:var(--arena);color:var(--ink);font-family:var(--f-ui);font-weight:700;font-size:12px;display:grid;place-items:center;border:2px solid var(--tc)}
.chip .cnt{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--courtline);color:var(--arena);font-family:var(--f-score);font-weight:800;font-size:14px;display:grid;place-items:center}
.chip .ball{position:absolute;bottom:-8px;right:-8px;width:26px;height:26px;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip.hit{animation:hit .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes hit{0%{transform:scale(1.35);box-shadow:0 0 0 14px color-mix(in srgb,var(--tc) 50%,transparent)}100%{transform:none}}
.chip.pick{outline:4px solid var(--gold);outline-offset:3px}
.chip.empty{background:transparent;border:2px dashed rgba(255,245,230,.5);box-shadow:none;color:var(--courtline);cursor:default}
.chip.empty .nm{opacity:.6}

.below{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;margin-top:14px;align-items:start}
.bench{background:var(--arena-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.bench .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bench ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.bchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px}
.bchip.can{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--panel))}
.bench .none{font-size:13px;color:var(--ink-3)}
.controls{display:flex;flex-direction:column;gap:6px;min-width:170px}
.hint{background:color-mix(in srgb,var(--gold) 14%,var(--arena-2));border:1px solid #7A5A22;color:var(--gold);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.feed{margin-top:14px}
.feed ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.feed li{display:flex;gap:10px;align-items:center;background:var(--arena-2);border-radius:10px;padding:6px 10px;font-size:14px;animation:slidein .35s ease-out}
.feed li:not(:first-child){animation:none;opacity:.75}
@keyframes slidein{from{transform:translateY(-8px);opacity:0}}
.feed .sw{width:10px;height:10px;border-radius:50%;background:var(--tc);flex:none}
.feed .sc{margin-left:auto;font-family:var(--f-score);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.tag{font-family:var(--f-ui);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

/* mascote */
.mascot{display:block;overflow:visible}
.mascot.cheer{animation:cheer .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes cheer{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18%) rotate(-10deg) scale(1.12)}60%{transform:translateY(0) rotate(8deg)}100%{transform:none}}

/* efeitos */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.plus{position:fixed;z-index:41;pointer-events:none;font-family:var(--f-score);font-weight:900;font-size:40px;color:var(--tc);text-shadow:0 3px 0 rgba(0,0,0,.35);animation:plus 1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes plus{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-80%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-220%) scale(1)}}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;background:var(--panel-2);border:1px solid var(--line);border-left:5px solid var(--tc,var(--gold));
  border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:calc(100vw - 32px);animation:toastin .25s ease-out}
@keyframes toastin{from{transform:translate(-50%,20px);opacity:0}}
#toast .t{font-weight:600;margin-right:4px}
#toast .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--tc,var(--gold));border-radius:0 0 0 14px;animation:shrink 5s linear forwards;margin:0}
@keyframes shrink{from{width:100%}to{width:0}}
#overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(6,12,22,.72);backdrop-filter:blur(4px);padding:84px 16px 24px;overflow-y:auto;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.ov{background:var(--arena-2);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:22px;padding:24px;max-width:460px;width:100%;text-align:center;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.ov .mascot{width:120px;height:120px;margin:-70px auto 6px;animation:cheer 1s .2s cubic-bezier(.3,1.6,.5,1)}
.ov .eyebrow{font-family:var(--f-ui);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--tc);font-size:14px}
.ov h2{font-family:var(--f-score);font-weight:900;font-size:clamp(40px,8vw,58px);line-height:.95;margin:4px 0 8px;text-transform:uppercase}
.ov .sets{font-family:var(--f-score);font-weight:800;font-size:22px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ov .mvp{margin:14px 0 4px;color:var(--ink-2)}
.ov .mvp b{color:var(--ink)}
.ov .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* evolução */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--arena-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-score);font-weight:900;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.tablebox{overflow-x:auto;background:var(--arena-2);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-ui);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);background:var(--arena-2);position:sticky;top:0}
th button{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
th button.on{color:var(--gold)}
td:nth-child(2),th:nth-child(2){text-align:left}
td.rank{font-family:var(--f-score);font-weight:800;font-size:20px;color:var(--ink-3);width:40px}
tr:first-child td.rank{color:var(--gold)}
td.big{font-family:var(--f-score);font-weight:800;font-size:20px}
.pc{font-size:12px;color:var(--ink-3);margin-left:4px}
th .sh{display:none}
.spark{width:96px;height:26px;display:block;margin-left:auto}
.hist-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:10px}
.mcard{background:var(--arena-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mline{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px}
.mline .mascot{width:34px;height:34px}
.mline .n{font-family:var(--f-score);font-weight:800;font-size:19px;line-height:1.25;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mline .s{font-family:var(--f-score);font-weight:900;font-size:24px}
.mline.w .n::after{content:" ✓";color:var(--ok)}
.mfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--panel);font-size:12px;font-family:var(--f-ui);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.pill.live{background:#4A1F26;color:#FFB0B0}
h2.day{font-family:var(--f-ui);font-weight:700;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:22px 0 0}
h2.day::first-letter{text-transform:uppercase}
.mcard{position:relative}
.mcard.picked{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--arena-2))}
.mcard.open{grid-column:1/-1}
.mcard.selecting{padding-left:54px}
.selbox{position:absolute;top:0;bottom:0;left:0;width:46px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink-3) 8%,transparent);border:0;border-right:1px solid var(--line);border-radius:14px 0 0 14px;padding:0;z-index:1}
.mcard.picked .check{background:var(--danger);border-color:var(--danger)}
.mcard.picked .check::after{content:"";width:9px;height:5px;border-left:3px solid var(--arena);border-bottom:3px solid var(--arena);transform:rotate(-45deg) translate(1px,-1px)}
.detail{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px;animation:slidein .25s ease-out}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dcol{min-width:0;border-left:4px solid var(--tc);padding-left:10px}
.dcol ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.dcol li{display:flex;align-items:center;gap:6px;font-size:14px}
.dcol li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcol li b{font-family:var(--f-score);font-size:18px;min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
.dcol li.advl{color:var(--ink-3);border-top:1px dashed var(--line);padding-top:4px;margin-top:2px}
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.form{background:var(--arena-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.form:first-child{border-color:var(--gold)}
.fhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.frec{font-family:var(--f-score);font-weight:900;font-size:26px;line-height:1}
.fnames{display:flex;flex-wrap:wrap;gap:5px}
.fp{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border-radius:999px;padding:3px 10px 3px 4px;font-weight:600;font-size:13.5px}
.saldo{font-weight:700}
.saldo.pos{color:var(--ok)} .saldo.neg{color:var(--danger)}
table.pairs{min-width:0}
table.pairs td:nth-child(2){white-space:normal}
@media (max-width:700px){ .dcols{grid-template-columns:1fr} }
h2.sec{font-family:var(--f-score);font-weight:800;font-size:26px;text-transform:uppercase;margin:26px 0 6px}

@media (max-width:900px){
  .teams{grid-template-columns:1fr 1fr}
  .pool{grid-column:1/-1;order:-1}
  .cfg{grid-template-columns:1fr 1fr}
}
@media (max-width:700px){
  .teams{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr;gap:8px}
  .mid{grid-column:1/-1;grid-row:2;flex-direction:row;gap:12px;padding:0;min-width:0;flex-wrap:wrap}
  .tb{padding:8px 10px;gap:8px;flex-direction:column;align-items:stretch;text-align:left}
  .tb.B{flex-direction:column;text-align:right}
  .tb .top-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .tb.B .top-row{flex-direction:row-reverse}
  .tb .mascot{width:46px;height:46px}
  .score{font-size:64px}
  .below{grid-template-columns:1fr}
  .controls{flex-direction:row;flex-wrap:wrap;min-width:0}
  .controls .btn{flex:1 1 auto;justify-content:center}
  .kpis{grid-template-columns:1fr 1fr 1fr}
  .kpi b{font-size:28px}
  /* celular: abas viram barra fixa embaixo, ao alcance do polegar */
  .top{position:static;margin-bottom:14px;backdrop-filter:none;background:none;flex-wrap:nowrap}
  #acct{margin-left:auto}
  .acct .al{display:none}
  .acct{padding:4px}
  .spark{width:56px}
  th .lg{display:none} th .sh{display:inline}
  th{letter-spacing:.04em}
  td .pc{display:block;margin:0}
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:30;display:grid;grid-template-columns:repeat(var(--tabs,5),1fr);gap:0;
    border-radius:18px 18px 0 0;border-width:1px 0 0;

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('qv:' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },

const other = t => t === 'A' ? 'B' : 'A';

const MASCOTS = { leao:'Leões', tubarao:'Tubarões', aguia:'Águias', coruja:'Corujas', polvo:'Polvos', touro:'Touros' };
const COLORS = [
  {v:'#FF6B5B', n:'Coral'}, {v:'#2FD1BF', n:'Turquesa'}, {v:'#FFC233', n:'Âmbar'},

const gTag = g => g ? `<span class="gtag g${g}" title="${GEN[g]}">${g === 'h' ? 'H' : 'M'}</span>` : '';
const pg = id => (state.players[id] && state.players[id].g) || null;
const gOf = (m, id) => (m && m.gens && id in m.gens) ? m.gens[id] : pg(id);
const KINDS = { atk:'Ataque', blk:'Bloqueio', ace:'Saque' };
const POSMAP = {
  HA:{4:[2,1],3:[2,2],2:[2,3],5:[1,1],6:[1,2],1:[1,3]},
  HB:{2:[1,1],3:[1,2],4:[1,3],1:[2,1],6:[2,2],5:[2,3]},
  VA:{2:[1,2],3:[2,2],4:[3,2],1:[1,1],6:[2,1],5:[3,1]},

const ICON = {
  up:'<svg viewBox="0 0 16 16"><path d="M8 3l5 6H3z" fill="currentColor"/></svg>',
  down:'<svg viewBox="0 0 16 16"><path d="M8 13L3 7h10z" fill="currentColor"/></svg>',
  swap:'<svg viewBox="0 0 16 16"><path d="M2 5h10l-3-3M14 11H4l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x:'<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  chart:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 13.5h11M4 11V8M7 11V4.5M10 11V7M13 11V3"/></svg>',
  lock:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>'
};
const BALL = '<svg class="ball" viewBox="0 0 24 24" aria-label="Saque"><circle cx="12" cy="12" r="10.5" fill="#FFF5E6" stroke="#0C1626" stroke-width="1.6"/><path d="M12 1.5c-1.2 4.2.2 8.2 3.2 10.6M22.4 13.2c-3.8-1.7-7.9-1.1-10.6 1.2M4.6 19.6c1.7-3.8 4.6-6.6 7.4-6.2" fill="none" stroke="#0C1626" stroke-width="1.5"/></svg>';

/* ---------- mascotes (SVG) ---------- */
function star(cx, cy, ro, ri, n){
  const p = [];
  for(let i = 0; i < n * 2; i++){ const r = i % 2 ? ri : ro, a = Math.PI * i / n - Math.PI / 2; p.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1)); }
  return p.join(' ');
}
function mascotSVG(kind, color, cls){
  const dark = `color-mix(in srgb, ${color} 55%, #0C1626)`;
  const light = `color-mix(in srgb, ${color} 40%, #ffffff)`;
  const ink = '#0C1626';
  let back = '', front = '', eyeR = 7.5;
  let mouth = `<path d="M43 65 Q50 71 57 65" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  switch(kind){
    case 'leao':
      back = `<polygon points="${star(50,55,47,36,14)}" style="fill:${dark}"/><circle cx="27" cy="31" r="8" style="fill:${color}"/><circle cx="73" cy="31" r="8" style="fill:${color}"/>`;
      front = `<path d="M45 58 L55 58 L50 63 Z" fill="${ink}"/>`;
      mouth = `<path d="M50 63 V66 M44 66 Q47 69 50 66 Q53 69 56 66" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
      break;
    case 'tubarao':
      back = `<path d="M44 30 L60 3 L67 31 Z" style="fill:${dark}"/><path d="M19 62 L4 74 L24 72 Z" style="fill:${dark}"/><path d="M81 62 L96 74 L76 72 Z" style="fill:${dark}"/>`;
      front = `<path d="M24 52 l4 -3 M24 58 l4 -3 M76 52 l-4 -3 M76 58 l-4 -3" stroke="${dark}" stroke-width="2.5" stroke-linecap="round"/>`;
      mouth = `<path d="M37 64 Q50 74 63 64 Z" fill="${ink}"/><path d="M40 65 L43 69 L46 66.5 L50 70 L54 66.5 L57 69 L60 65" fill="#fff"/>`;
      break;
    case 'aguia':
      back = `<path d="M40 27 L34 8 L46 22 Z M50 25 L50 4 L56 22 Z M60 27 L68 9 L62 26 Z" style="fill:${dark}"/>`;
      front = `<path d="M31 41 L46 45 M69 41 L54 45" stroke="${ink}" stroke-width="3.2" stroke-linecap="round"/>`;
      mouth = `<path d="M42 57 L58 57 L50 71 Z" fill="#FFB020" stroke="${ink}" stroke-width="1.5" stroke-linejoin="round"/>`;
      break;
    case 'coruja':
      back = `<path d="M23 38 L24 10 L42 28 Z M77 38 L76 10 L58 28 Z" style="fill:${dark}"/>`;
      eyeR = 10;
      front = `<circle cx="39" cy="50" r="13" style="fill:${light}"/><circle cx="61" cy="50" r="13" style="fill:${light}"/>`;
      mouth = `<path d="M46 63 L54 63 L50 69 Z" fill="#FFB020"/>`;
      break;
    case 'polvo':
      back = [16,32,50,68,84].map((x,i) => `<path d="M${x} 70 q ${i%2?6:-6} 14 ${i<2?-6:i>2?6:0} 24" stroke-width="10" stroke-linecap="round" fill="none" style="stroke:${dark}"/>`).join('');
      front = `<circle cx="30" cy="38" r="3.5" style="fill:${dark}"/><circle cx="68" cy="33" r="4.5" style="fill:${dark}"/><circle cx="74" cy="44" r="2.5" style="fill:${dark}"/>`;
      break;
    case 'touro':
      back = `<path d="M27 36 Q6 26 14 6 Q20 24 40 28 Z M73 36 Q94 26 86 6 Q80 24 60 28 Z" fill="#F4E6C8" stroke="${ink}" stroke-width="1.5"/>`;
      front = `<ellipse cx="50" cy="66" rx="15" ry="10" style="fill:${light}"/><circle cx="45" cy="66" r="2.4" fill="${ink}"/><circle cx="55" cy="66" r="2.4" fill="${ink}"/><path d="M45 74 Q50 80 55 74" stroke="#FFD15C" stroke-width="2.6" fill="none"/>`;
      mouth = '';
      break;
  }
  const eyes = `<circle cx="39" cy="50" r="${eyeR}" fill="#fff"/><circle cx="61" cy="50" r="${eyeR}" fill="#fff"/><circle cx="40.5" cy="51" r="${eyeR*.5}" fill="${ink}"/><circle cx="62.5" cy="51" r="${eyeR*.5}" fill="${ink}"/><circle cx="42.2" cy="49" r="1.6" fill="#fff"/><circle cx="64.2" cy="49" r="1.6" fill="#fff"/>`;
  const cheeks = `<ellipse cx="29" cy="61" rx="4.5" ry="2.8" fill="#FF8FA0" opacity=".55"/><ellipse cx="71" cy="61" rx="4.5" ry="2.8" fill="#FF8FA0" opacity=".55"/>`;
  return `<svg class="mascot ${cls||''}" viewBox="0 0 100 100" aria-hidden="true">${back}<ellipse cx="50" cy="56" rx="32" ry="31" style="fill:${color}" stroke="${ink}" stroke-opacity=".25" stroke-width="2"/><ellipse cx="50" cy="73" rx="17" ry="10" style="fill:${light}" opacity=".5"/>${front}${eyes}${cheeks}${mouth}</svg>`;
}

/* ---------- estado ---------- */
const defaultDraft = () => ({
  A:{ name:'Leões', mascot:'leao', color:COLORS[0].v, roster:[] },
  B:{ name:'Tubarões', mascot:'tubarao', color:COLORS[1].v, roster:[] },
  cfg:{ setPoints:25, tiePoints:15, bestOf:3 }, firstServe:'A'
});
const cache = LS.get('cache', { players:{}, matches:[] });
const state = {
  view: LS.get('view', 'jogadores'),
  players: cache.players || {},
  matches: cache.matches || [],
  present: new Set(LS.get('present', [])),
  draft: LS.get('draft', null) || defaultDraft(),
  live: null,
  sound: LS.get('sound', true),
  sort: 'pts', gf: 'all',
  ui: { sub:null, confirm:null, lastEv:null },
  mode: 'loading', note: ''
};
const saveDraft = () => LS.set('draft', state.draft);
const savePresent = () => LS.set('present', [...state.present]);
const saveCache = () => LS.set('cache', { players: state.players, matches: state.matches.slice(0, 80) });

/* ---------- armazenamento (banco compartilhado, ou local como reserva) ---------- */
const store = {
  db: null,
  async init(){
    let db = null, mode = 'db';
    if(window.LC_FIREBASE && window.firebase){
      // versão web: banco do grupo no Firebase (Firestore), com login de organizador
      try{
        firebase.initializeApp(window.LC_FIREBASE);
        db = firebase.firestore(); mode = 'fb';
        try{ await db.enablePersistence({ synchronizeTabs:true }); }catch(e){}
        state.authReady = false;
        firebase.auth().onAuthStateChanged(u => {
          state.user = u ? { email:u.email || '' } : null; state.authReady = true;
          renderAcct(); render();
        });
      }catch(e){ db = null; }
    } else {
      try{ db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; }catch(e){ db = null; }
    }
    if(!db){
      state.mode = 'local';
      state.players = LS.get('players', state.players);
      state.matches = LS.get('matches', state.matches);
      pickLive(); render(); return;
    }
    this.db = db; state.mode = mode;
    renderAcct();
    const net = () => { state.offline = !navigator.onLine; renderNote(); };
    addEventListener('online', net); addEventListener('offline', net); net();
    let ready = { p:false, m:false };
    const timer = setTimeout(() => { if(!(ready.p && ready.m) && navigator.onLine){ state.note = 'Ainda não consegui falar com o banco de dados do grupo. O que aparece pode estar desatualizado.'; renderNote(); } }, 10000);
    const settle = () => { if(ready.p && ready.m){ clearTimeout(timer); if(state.note){ state.note = ''; renderNote(); } } };
    const onErr = e => { clearTimeout(timer); state.note = 'A conexão com o banco de dados caiu (' + (e && e.code || 'erro') + '). Recarregue a página para tentar de novo.'; renderNote(); };
    db.collection('players').onSnapshot(snap => {
      const p = {}; snap.docs.forEach(d => { p[d.id] = Object.assign({ id:d.id }, d.data()); });
      state.players = p; if(!snap.metadata.fromCache) ready.p = true; settle(); saveCache();
      if(state.view !== 'partida') render();
    }, onErr);
    db.collection('matches').orderBy('startedAt', 'desc').limit(300).onSnapshot(snap => {
      state.matches = snap.docs.map(d => Object.assign({}, d.data(), { id:d.id }));
      if(!snap.metadata.fromCache) ready.m = true; settle();
      const adopted = pickLive(); saveCache();
      if(state.view !== 'partida' || adopted) render(); else renderNav();
    }, onErr);
  },
  async savePlayer(p){
    state.players[p.id] = p;
    if(this.db){ try{ await this.db.doc('players/' + p.id).set({ name:p.name, createdAt:p.createdAt, g:p.g || null }); }catch(e){ writeErr(e); } }
    else LS.set('players', state.players);
    saveCache();
  },
  async deletePlayer(id){
    delete state.players[id];
    if(this.db){ try{ await this.db.doc('players/' + id).delete(); }catch(e){ writeErr(e); } }
    else LS.set('players', state.players);
    saveCache();
  },
  q: {},
  async saveMatch(m){
    const i = state.matches.findIndex(x => x.id === m.id);
    const copy = clone(m);
    if(i >= 0) state.matches[i] = copy; else state.matches.unshift(copy);
    saveCache();
    if(!this.db){ LS.set('matches', state.matches); return; }
    const w = this.q[m.id] || (this.q[m.id] = { busy:false, next:null });
    w.next = copy;
    if(w.busy) return;
    w.busy = true;
    while(w.next){ const body = w.next; w.next = null; try{ await this.db.doc('matches/' + m.id).set(body); }catch(e){ writeErr(e); } }
    w.busy = false;
  },
  async deleteMatch(id){
    state.matches = state.matches.filter(x => x.id !== id);
    if(this.db){ try{ await this.db.doc('matches/' + id).delete(); }catch(e){ writeErr(e); } }
    else LS.set('matches', state.matches);
    saveCache();
  },
  // leva para o banco do grupo o que foi salvo só neste aparelho (antes do Firebase)
  localLeftovers(){
    if(state.mode !== 'fb' || LS.get('importDone', false)) return { players:[], matches:[] };
    const lp = LS.get('players', {}), lm = LS.get('matches', []);
    return {
      players: Object.values(lp).filter(p => p && p.id && !state.players[p.id]),
      matches: (Array.isArray(lm) ? lm : []).filter(m => m && m.id && m.status !== 'cancelled' && !state.matches.some(x => x.id === m.id))
    };
  },
  async importLocal(){
    const { players, matches } = this.localLeftovers();
    const ops = [
      ...players.map(p => ['players/' + p.id, { name:p.name, createdAt:p.createdAt || Date.now(), g:p.g || null }]),
      ...matches.map(m => ['matches/' + m.id, Object.assign(clone(m), { status:m.status === 'live' ? 'done' : m.status })])
    ];
    for(let i = 0; i < ops.length; i += 400){
      const b = this.db.batch();
      ops.slice(i, i + 400).forEach(([path, data]) => b.set(this.db.doc(path), data));
      await b.commit();
    }
    LS.set('importDone', true);
    return { p:players.length, m:matches.length };
  }
};
function writeErr(e){
  const c = e && e.code;
  if(c === 'permission-denied' || c === 'unauthenticated'){
    state.note = state.user ? 'Sua conta não tem permissão para alterar os dados do grupo.' : 'Entre como organizador para salvar alterações.';
    renderNote(); return;
  }
  state.note = c === 'invalid_argument' ? 'Você pode ver os dados, mas não tem permissão para alterar. Peça acesso de colaborador a quem compartilhou.'
    : c === 'quota_exceeded' ? 'O banco de dados do grupo está cheio. Exclua partidas antigas em Evolução.'
    : 'Não consegui salvar agora. Confira a conexão; o placar continua neste aparelho.';
  renderNote();
}
function pickLive(){
  if(state.live){
    const r = state.matches.find(x => x.id === state.live.id);
    if(r && (r.rev || 0) > (state.live.rev || 0)){ state.live = clone(r); return true; }
    if(r && r.status === 'cancelled'){ state.live = null; return true; }
    return false;
  }
  const l = state.matches.find(x => x.status === 'live');
  if(l){ state.live = clone(l); return true; }
  return false;
}

/* ---------- regras do jogo (reconstrói tudo a partir dos lances) ---------- */
const rot = c => c.map((_, i) => c[(i + 1) % 6]);
function replay(m){
  const st = { court:{ A:m.start.A.slice(), B:m.start.B.slice() }, serving:m.firstServe, sets:[{A:0,B:0,w:null}], wins:{A:0,B:0}, done:false, winner:null, log:[], swaps:[] };
  // fila da reserva (ordem de entrada) de cada time
  st.queue = { A:m.teams.A.roster.filter(id => !m.start.A.includes(id)), B:m.teams.B.roster.filter(id => !m.start.B.includes(id)) };
  // quem está em cada time agora (muda quando alguém troca de time no meio da partida)
  st.roster = { A:m.teams.A.roster.slice(), B:m.teams.B.roster.slice() };
  // quem já sacou nesta partida (o time que começa sacando já conta)
  st.served = { A:m.firstServe === 'A', B:m.firstServe === 'B' };
  const man = id => { const g = gOf(m, id); return g === 'h' || !g; };
  // rodízio no saque: em partidas novas, vale para o time que tiver reserva (partidas antigas sem "rod" ficam como eram)
  const rodOn = T => Array.isArray(m.rod) && m.cfg.rodizio !== 0 && (m.rod.includes(T) || m.events.some(e => e.t === 'swap' || e.t === 'add'));
  const where = id => { for(const T of ['A','B']){ const i = st.court[T].indexOf(id); if(i >= 0) return { team:T, slot:i }; if(st.queue[T].includes(id)) return { team:T, slot:-1 }; } return null; };
  const need = Math.ceil(m.cfg.bestOf / 2);
  for(const ev of m.events){
    if(st.done) break;
    if(ev.t === 'pt'){
      const s = st.sets[st.sets.length - 1], o = other(ev.team);
      s[ev.team]++;
      let swap = null;
      if(st.serving !== ev.team && m.firstNoRot && !st.served[ev.team]){
        // regra do grupo: no início, quem está na posição 1 do time que recebe ainda não sacou;
        // então, no primeiro ponto desse time, ele não roda: quem está na posição 1 vai sacar
        st.served[ev.team] = true; st.serving = ev.team;
      } else if(st.serving !== ev.team){
        st.served[ev.team] = true;
        st.court[ev.team] = rot(st.court[ev.team]); st.serving = ev.team;
        // rodízio no saque: o homem que chegaria para sacar vai para a reserva e o primeiro homem da fila entra sacando
        const c = st.court[ev.team], q = st.queue[ev.team], srv = c[0];
        if(rodOn(ev.team) && srv && man(srv)){
          const qi = q.findIndex(man);
          if(qi >= 0){ const inn = q.splice(qi, 1)[0]; c[0] = inn; q.push(srv); swap = { team:ev.team, out:srv, in:inn }; st.swaps.push(swap); }
        }
      }
      st.log.push({ ev, A:s.A, B:s.B, set:st.sets.length, swap });
      const idx = st.sets.length - 1;
      const tie = m.cfg.bestOf > 1 && idx === m.cfg.bestOf - 1;
      const target = tie ? m.cfg.tiePoints : m.cfg.setPoints;
      if(s[ev.team] >= target && s[ev.team] - s[o] >= 2){
        s.w = ev.team; st.wins[ev.team]++;
        if(st.wins[ev.team] >= need){ st.done = true; st.winner = ev.team; }
        else { st.sets.push({A:0,B:0,w:null}); st.serving = o; }
      }
    } else if(ev.t === 'sub'){
      const c = st.court[ev.team], i = c.indexOf(ev.out); if(i >= 0) c[i] = ev.in;
      const q = st.queue[ev.team], qi = q.indexOf(ev.in); if(qi >= 0) q.splice(qi, 1); if(ev.out && !q.includes(ev.out)) q.push(ev.out);
    } else if(ev.t === 'swap'){
      // ajuste de posições: troca dois lugares (quadra, banco ou outro time); lugar vazio vale como destino
      const la = ev.a.id ? where(ev.a.id) : { team:ev.a.team, slot:ev.a.slot };
      const lb = ev.b.id ? where(ev.b.id) : { team:ev.b.team, slot:ev.b.slot };
      if(!la || !lb) continue;
      const take = (l, id) => { if(!id) return; if(l.slot >= 0) st.court[l.team][l.slot] = null; else { const q = st.queue[l.team]; q.splice(q.indexOf(id), 1); } };
      const put = (l, id) => { if(!id) return; if(l.slot >= 0 && !st.court[l.team][l.slot]) st.court[l.team][l.slot] = id; else st.queue[l.team].push(id); };
      take(la, ev.a.id); take(lb, ev.b.id);
      put(lb, ev.a.id); put(la, ev.b.id);
      const move = (id, from, to) => { if(!id || from === to) return; st.roster[from] = st.roster[from].filter(x => x !== id); if(!st.roster[to].includes(id)) st.roster[to].push(id); };
      move(ev.a.id, la.team, lb.team); move(ev.b.id, lb.team, la.team);
      // lugar que ficou vazio na quadra é ocupado por quem está esperando no banco daquele time
      for(const T of ['A','B']){ const c = st.court[T]; for(let i = 0; i < 6; i++) if(!c[i] && st.queue[T].length) c[i] = st.queue[T].shift(); }
    } else if(ev.t === 'add'){
      if(!st.roster.A.includes(ev.id) && !st.roster.B.includes(ev.id)){ st.roster[ev.team].push(ev.id); st.queue[ev.team].push(ev.id); }
    } else if(ev.t === 'rot'){
      st.court[ev.team] = rot(st.court[ev.team]);
    } else if(ev.t === 'srv'){
      st.serving = ev.team;
      // antes do primeiro ponto, trocar quem saca também troca quem "já sacou"
      if(!st.log.length) st.served = { A:ev.team === 'A', B:ev.team === 'B' };
    }
  }
  if(m.status === 'done' && !st.done){ st.done = true; st.winner = m.winner || null; }
  return st;
}

const _rosterCache = new Map();
function rosters(m){

  let r = _rosterCache.get(k);
  if(!r){ const st = replay(m); r = { A:st.roster.A.slice(), B:st.roster.B.slice() }; _rosterCache.set(k, r); }
  return r;
}

  const ptsBy = {}; m.events.forEach(e => { if(e.t === 'pt' && e.p) ptsBy[e.p] = (ptsBy[e.p] || 0) + 1; });
  const tb = T => { const t = m.teams[T];

function computeStats(){
  const P = {};
  const done = state.matches.filter(m => m.status === 'done').sort((a, b) => a.startedAt - b.startedAt);
  for(const m of done){
    const cnt = {};
    for(const ev of m.events) if(ev.t === 'pt' && ev.p){ const c = cnt[ev.p] = cnt[ev.p] || { n:0, atk:0, blk:0, ace:0 }; c.n++; if(ev.k) c[ev.k]++; }
    for(const T of ['A','B']) for(const id of rosters(m)[T]){
      const s = P[id] = P[id] || { id, name:pname(id, m), games:0, wins:0, pts:0, atk:0, blk:0, ace:0, series:[] };
      const c = cnt[id] || { n:0, atk:0, blk:0, ace:0 };
      s.games++; if(m.winner === T) s.wins++; s.pts += c.n; s.atk += c.atk; s.blk += c.blk; s.ace += c.ace; s.series.push(c.n);
    }
  }
  return { list:Object.values(P), done };
}

  const area = d + ` L${px(s.length - 1).toFixed(1)} ${h} L${px(0).toFixed(1)} ${h} Z`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-label="Pontos nas últimas ${s.length} partidas: ${s.join(', ')}"><path d="${area}" fill="#FFD15C" opacity=".14"/><path d="${d}" fill="none" stroke="#FFD15C" stroke-width="2" stroke-linejoin="round"/><circle cx="${px(s.length - 1)}" cy="${py(s[s.length - 1])}" r="3" fill="#FFD15C"/></svg>`;
}
function lineupStats(done){
  const F = {}, D = {};
  for(const m of done){
    const st = replay(m);
    for(const T of ['A','B']){
      const ids = rosters(m)[T].slice().sort();
      const diff = st.sets.reduce((n, s) => n + s[T] - s[other(T)], 0);
      const won = m.winner === T ? 1 : 0;
      const f = F[ids.join('|')] = F[ids.join('|')] || { key:ids.join('|'), ids, games:0, wins:0, diff:0, last:0, m };
      f.games++; f.wins += won; f.diff += diff; if(m.startedAt > f.last){ f.last = m.startedAt; f.m = m; }
      for(let i = 0; i < ids.length; i++) for(let j = i + 1; j < ids.length; j++){
        const k = ids[i] + '|' + ids[j];
        const d = D[k] = D[k] || { key:k, ids:[ids[i], ids[j]], games:0, wins:0, diff:0, m };
        d.games++; d.wins += won; d.diff += diff; d.m = m;
      }
    }
  }
  const rank = (a, b) => b.wins / b.games - a.wins / a.games || b.games - a.games || b.diff - a.diff;
  const forms = Object.values(F).sort(rank);
  let pairs = Object.values(D);
  if(pairs.some(p => p.games >= 2)) pairs = pairs.filter(p => p.games >= 2);
  pairs.sort(rank);
  return { forms:forms.slice(0, 6), pairs:pairs.slice(0, 10) };
}

function playerData(id){
  const done = state.matches.filter(m => m.status === 'done').sort((a, b) => a.startedAt - b.startedAt);
  const games = [], mates = {}, opps = {};
  let bench = 0, moved = 0;
  for(const m of done){
    const R = rosters(m), T = R.A.includes(id) ? 'A' : R.B.includes(id) ? 'B' : null;
    if(!T) continue;
    const O = other(T), st = replay(m), won = m.winner === T;
    const k = { atk:0, blk:0, ace:0, x:0 }; let pts = 0;
    for(const e of m.events) if(e.t === 'pt' && e.p === id){ pts++; k[e.k || 'x']++; }
    games.push({ m, T, won, draw:!m.winner, pts, k, sets:st.sets.filter(s => s.w || s.A || s.B), wins:st.wins });
    for(const o of R[T]) if(o !== id){ const x = mates[o] = mates[o] || { id:o, g:0, w:0, m }; x.g++; x.w += won ? 1 : 0; x.m = m; }
    for(const o of R[O]){ const x = opps[o] = opps[o] || { id:o, g:0, w:0, m }; x.g++; x.w += won ? 1 : 0; x.m = m; }
    if(m.rodInfo){ if(m.rodInfo.startBench === id) bench++; if(m.rodInfo.movedIn === id) moved++; }
  }
  const n = games.length, wins = games.filter(g => g.won).length, pts = games.reduce((s, g) => s + g.pts, 0);
  const k = games.reduce((s, g) => { for(const x in g.k) s[x] += g.k[x]; return s; }, { atk:0, blk:0, ace:0, x:0 });
  let best = null; games.forEach(g => { if(!best || g.pts > best.pts) best = g; });
  let streak = 0, sw = null;
  for(let i = n - 1; i >= 0; i--){ const g = games[i]; if(g.draw) break; if(sw === null) sw = g.won; if(g.won !== sw) break; streak++; }
  const ranking = computeStats().list.sort((a, b) => b.pts - a.pts || b.wins - a.wins);
  const rank = ranking.findIndex(s => s.id === id) + 1;
  const byRate = (a, b) => b.w / b.g - a.w / a.g || b.g - a.g;
  const mateList = Object.values(mates).sort(byRate);
  const oppList = Object.values(opps).sort((a, b) => a.w / a.g - b.w / b.g || b.g - a.g);
  const min2 = l => l.some(x => x.g >= 2) ? l.filter(x => x.g >= 2) : l;
  return { games, n, wins, pts, k, best, streak, sw, rank, total:ranking.length, bench, moved,
    mates:min2(mateList).slice(0, 5), opps:min2(oppList).slice(0, 5), first:games[0] ? games[0].m.startedAt : null };
}

const fx = { cv:$('#fx'), ctx:null, parts:[], running:false };
function sizeFx(){ const d = devicePixelRatio || 1; fx.cv.width = innerWidth * d; fx.cv.height = innerHeight * d; fx.ctx = fx.cv.getContext('2d'); fx.ctx.setTransform(d, 0, 0, d, 0, 0); }

function burst(x, y, color, n){
  if(reduced) return;
  const cols = [color, color, '#FFF5E6', '#FFD15C'];
  for(let i = 0; i < n; i++){ const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 7;
    fx.parts.push({ x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 4, r:Math.random() * 6, vr:(Math.random() - .5) * .4, w:5 + Math.random() * 6, h:3 + Math.random() * 4, c:cols[i % cols.length], life:60 + Math.random() * 40 }); }

}
function tick(){
  const c = fx.ctx; c.clearRect(0, 0, innerWidth, innerHeight);
  fx.parts = fx.parts.filter(p => p.life > 0);
  for(const p of fx.parts){ p.vy += .28; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    c.save(); c.globalAlpha = Math.min(1, p.life / 30); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore(); }

function sound(type){
  if(!state.sound) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();

    const tone = (f, s, d, g, w) => { const o = ac.createOscillator(), v = ac.createGain(); o.type = w || 'sine'; o.frequency.value = f;
      v.gain.setValueAtTime(0, t + s); v.gain.linearRampToValueAtTime(g || .14, t + s + .01); v.gain.exponentialRampToValueAtTime(.001, t + s + d);
      o.connect(v).connect(ac.destination); o.start(t + s); o.stop(t + s + d + .05); };
    if(type === 'pt'){ tone(880, 0, .12); tone(1320, .07, .2); }
    else if(type === 'set'){ tone(2400, 0, .22, .05, 'triangle'); tone(2400, .28, .5, .05, 'triangle'); }
    else if(type === 'win'){ [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .35, .12, 'triangle')); }

function startMatch(teams, cfg, firstServe, extra){
  extra = extra || {};
  const names = {}, gens = {};
  [...teams.A.roster, ...teams.B.roster].forEach(id => { names[id] = pname(id); gens[id] = pg(id); });
  const pad = r => { const a = r.slice(0, 6); while(a.length < 6) a.push(null); return a; };
  const rod = cfg.rodizio === 0 ? [] : ['A','B'].filter(T => teams[T].roster.length > 6);
  const one = rod.length === 1 ? rod[0] : null;
  const rodInfo = one ? { team:one, startBench:teams[one].roster[6] || null, movedIn:extra.movedIn || null } : null;
  const m = { id:uid(), startedAt:Date.now(), status:'live', rev:1, cfg:clone(cfg), firstServe,
    teams:{ A:clone(teams.A), B:clone(teams.B) }, start:{ A:pad(teams.A.roster), B:pad(teams.B.roster) }, names, gens, rod, rodInfo,
    startNote:extra.note || null, events:[], winner:null,
    firstNoRot:true }; // regra: o time que recebe não roda no seu primeiro ponto (partidas antigas ficam como eram)
  state.live = m; state.ui.sub = null; state.ui.confirm = null;
  state.ui.edit = { sel:null }; // começa conferindo as posições escolhidas pelos times
  store.saveMatch(m);
  state.view = 'partida'; LS.set('view', 'partida'); keepAwake(); render();
}
function commit(m){ m.rev = (m.rev || 0) + 1; store.saveMatch(m); }
/* rodízio entre partidas: quem já começou na reserva e quem já trocou de time */
function rodCounts(){
  const b = {}, mv = {};
  for(const m of state.matches){ if(m.status === 'cancelled' || !m.rodInfo) continue; const r = m.rodInfo;
    if(r.startBench) b[r.startBench] = (b[r.startBench] || 0) + 1; if(r.movedIn) mv[r.movedIn] = (mv[r.movedIn] || 0) + 1; }
  return { b, mv };
}
const isMan = id => { const g = pg(id); return g === 'h' || !g; };
const pickFewest = (list, cnt) => list.slice().sort((x, y) => (cnt[x] || 0) - (cnt[y] || 0) || Math.random() - .5)[0];
function nextLineup(m){
  // parte dos times como terminaram (quem trocou de time no meio da partida fica onde terminou)
  const fin = rosters(m);
  const teams = { A:clone(m.teams.A), B:clone(m.teams.B) };
  ['A','B'].forEach(T => { teams[T].roster = fin[T].filter(id => state.players[id]); });
  const base = { teams, cfg:clone(m.cfg), firstServe:other(m.firstServe), movedIn:null, note:null };
  if(m.cfg.rodizio === 0) return base;
  const dA = teams.A.roster.length - teams.B.roster.length;
  if(Math.abs(dA) !== 1) return base;
  const T = dA > 0 ? 'A' : 'B', O = other(T), RT = teams[T].roster, RO = teams[O].roster;
  const i0 = m.rodInfo || {};
  const info = { team:T, startBench:i0.team === T && RT.includes(i0.startBench) ? i0.startBench : null, movedIn:i0.movedIn || null };
  const { b, mv } = rodCounts();
  // quem troca de time: um homem do time que rodou, nunca quem começou na reserva (nem quem acabou de chegar, se der)
  let cands = RT.filter(id => isMan(id) && id !== info.startBench && id !== info.movedIn);
  if(!cands.length) cands = RT.filter(id => isMan(id) && id !== info.startBench);

function drawTeams(kind){
  const ids = sortedPlayers().filter(p => state.present.has(p.id)).map(p => p.id);
  let order;
  if(kind === 'bal'){
    const tot = playerTotals();
    const avg = id => tot[id] && tot[id].g ? tot[id].p / tot[id].g : null;
    const known = ids.map(avg).filter(v => v !== null);
    const mean = known.length ? known.reduce((a, b) => a + b, 0) / known.length : 0;
    order = ids.map(id => ({ id, v:(avg(id) ?? mean) + Math.random() * .01 })).sort((a, b) => b.v - a.v).map(x => x.id);
  } else {
    order = ids.slice(); for(let i = order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  }
  // divide mulheres, depois homens, depois quem está sem gênero; em cada grupo, escolha em "cobra" (A B B A)
  // cada jogador (do mais forte para o mais fraco) vai para o time com menos gente do mesmo gênero;
  // empate: o time com menos jogadores; novo empate: o time mais fraco até agora
  const A = [], B = [], pow = { A:0, B:0 };
  const str = {}; order.forEach((id, i) => { str[id] = order.length - i; });
  const cntG = (r, g) => r.filter(x => pg(x) === g).length;
  for(const g of ['m', 'h', null]){
    for(const id of order.filter(x => pg(x) === g)){
      const dg = cntG(A, g) - cntG(B, g), dn = A.length - B.length, dp = pow.A - pow.B;
      const T = dg ? (dg < 0 ? 'A' : 'B') : dn ? (dn < 0 ? 'A' : 'B') : dp ? (dp < 0 ? 'A' : 'B') : (Math.random() < .5 ? 'A' : 'B');
      (T === 'A' ? A : B).push(id); pow[T] += kind === 'bal' ? str[id] : 0;
    }
  }
  // rotação alternando homem e mulher; quem fica de fora dos 6 vai para o banco
  const sh = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const { b:benchCnt } = rodCounts();
  const alternate = r => {
    // time com mais de 6: um homem (quem menos começou na reserva) começa na reserva, para o rodízio no saque
    let benchMan = null;
    if(r.length > 6){ const men = r.filter(isMan); if(men.length){ benchMan = pickFewest(men, benchCnt); r = r.filter(id => id !== benchMan); } }
    const hs = sh(r.filter(id => pg(id) === 'h')), ms = sh(r.filter(id => pg(id) === 'm')), xs = sh(r.filter(id => !pg(id)));
    const big = hs.length >= ms.length ? hs : ms, small = (big === hs ? ms : hs).concat(xs), out = [];
    while(big.length || small.length){ if(big.length) out.push(big.shift()); if(small.length) out.push(small.shift()); }
    if(benchMan) out.splice(6, 0, benchMan);
    return out;
  };
  state.draft.A.roster = alternate(A); state.draft.B.roster = alternate(B); state.draft.movedIn = null; state.draft.note = null; saveDraft(); render();
}

function parseNames(text){
  const out = [], seen = new Set();
  for(let raw of String(text).split(/[\r\n,;\t]+/)){
    if(/:\s*$/.test(raw)) continue; // linhas de título, ex.: "Lista de quinta:"
    let s = raw.replace(/\p{Extended_Pictographic}|️|‍/gu, ' ')
      .replace(/^\s*(?:\d{1,3}\s*[-.)ºª°:]*\s*|[-*•·–—>]+\s*)/, '')

      .replace(/\s+/g, ' ').trim().replace(/^[.'-]+|[.'-]+$/g, '').trim();
    if(s.length < 2 || !/\p{L}/u.test(s)) continue;
    s = s.slice(0, 28).trim();
    s = s.split(' ').map((w, i) => {
      const lo = w.toLowerCase();
      if(i > 0 && /^(da|de|do|das|dos|e)$/.test(lo)) return lo;
      const allCaps = w.length > 2 && w === w.toUpperCase();
      return allCaps || w === lo ? lo.charAt(0).toUpperCase() + lo.slice(1) : w;
    }).join(' ');
    const k = nameKey(s); if(seen.has(k)) continue; seen.add(k); out.push(s);
  }
  return out;
}
function previewNames(text){
  const byKey = {}; Object.values(state.players).forEach(p => { byKey[nameKey(p.name)] = p; });
  const names = parseNames(text).map(n => ({ name:n, g:(byKey[nameKey(n)] || {}).g || null }));
  state.ui.addMsg = names.length ? '' : 'Não encontrei nenhum nome nesse texto.';
  state.ui.bulk = names.length ? names : null;
  const i = $('#newName'); if(i) i.value = '';
  render();
}
function addNames(text, list){
  const names = list || parseNames(text).map(n => ({ name:n, g:null }));
  state.ui.bulk = null;
  if(!names.length){ state.ui.addMsg = 'Não encontrei nenhum nome nesse texto.'; render(); return; }
  const existing = {}; Object.values(state.players).forEach(p => { existing[nameKey(p.name)] = p.id; });
  let added = 0, again = [];
  for(const { name, g } of names){
    const id = existing[nameKey(name)];
    if(id){ state.present.add(id); again.push(name); const op = state.players[id]; if(op && g && op.g !== g) store.savePlayer(Object.assign({}, op, { g })); continue; }
    const p = { id:uid(), name, g:g || null, createdAt:Date.now() + added };
    existing[nameKey(name)] = p.id; state.present.add(p.id); added++;
    store.savePlayer(p);
  }
  savePresent();
  const parts = [];
  if(added) parts.push(added === 1 ? '1 jogador cadastrado' : added + ' jogadores cadastrados');
  if(again.length) parts.push((again.length === 1 ? '1 já existia' : again.length + ' já existiam') + ' e ' + (again.length === 1 ? 'foi marcado' : 'foram marcados') + ' como presente');
  state.ui.addMsg = names.length > 1 || again.length ? parts.join(' · ') + '.' : '';
  state.ui.focusAdd = true; render();
}
document.addEventListener('submit', e => {
  if(e.target.id !== 'addForm') return; e.preventDefault();
  const inp = $('#newName'); if(!inp.value.trim()) return;
  if(!canWrite()){ openLogin('Para cadastrar jogadores, entre como organizador.'); return; }
  if(/[,;]/.test(inp.value)) previewNames(inp.value); else addNames(inp.value);
});
document.addEventListener('paste', e => {
  if(e.target.id !== 'newName' || !canWrite()) return;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if(!/[\r\n,;\t]/.test(text)) return;
  e.preventDefault(); previewNames(text);
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.classList.contains('tname-in')){ state.draft[el.dataset.team].name = el.value.trim() || ('Time ' + el.dataset.team); saveDraft(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.cfg){ const k = el.dataset.cfg; if(k === 'firstServe') state.draft.firstServe = el.value; else state.draft.cfg[k] = Number(el.value); saveDraft(); }
  if(el.classList.contains('tname-in')) render();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ $('#overlay').hidden = true; if(state.ui.edit && state.ui.edit.sel){ state.ui.edit.sel = null; render(); } }
  if((e.ctrlKey || e.metaKey) && e.key === 'z' && state.view === 'partida' && !/INPUT|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); act.undo(); }
});
$('#overlay').addEventListener('click', e => { if(e.target.id === 'overlay') $('#overlay').hidden = true; });
let rt = null;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { sizeFx(); const nav = $('#nav'); nav.classList.add('noanim'); moveInd(); requestAnimationFrame(() => nav.classList.remove('noanim')); const v = innerWidth < 700; if(v !== vertical){ vertical = v; if(state.view === 'partida') render(); } if(state.view === 'jogador') render(); }, 120); });

/* perfil do jogador: link próprio (#jogador-<id>) para abrir direto e compartilhar */
function openPlayer(id, push){
  if(!id) return;
  const from = tabIdx(state.view === 'jogador' ? 'evolucao' : state.view);
  state.view = 'jogador'; state.pid = id; state.ui.confirm = null; LS.set('view', 'evolucao');
  if(push !== false && location.hash !== '#jogador-' + id){ try{ history.pushState(null, '', '#jogador-' + id); }catch(e){ location.hash = 'jogador-' + id; } }
  render(); window.scrollTo({ top:0 });
  const sec = $('#main > section'); if(sec) sec.classList.add(from <= tabIdx('evolucao') ? 'in-r' : 'in-l');
}
function routeHash(){
  const m = /^#jogador-([A-Za-z0-9_-]+)$/.exec(location.hash);
  if(m) openPlayer(m[1], false);
  else if(state.view === 'jogador'){ state.view = 'evolucao'; render(); }
}
addEventListener('hashchange', routeHash);
addEventListener('popstate', routeHash);
Object.assign(act, {
  player(d){ $('#overlay').hidden = true; openPlayer(d.id); },
  openFromPlayer(d){ state.ui.open = d.id; history.replaceState && location.hash && history.replaceState(null, '', location.pathname + location.search); act.nav({ v:'historico' });
    setTimeout(() => { const c = document.querySelector('.mcard.open'); if(c) c.scrollIntoView({ behavior:'smooth', block:'start' }); }, 60); },
  async shareP(d, el){
    const url = location.href.split('#')[0] + '#jogador-' + state.pid;
    try{ await navigator.clipboard.writeText(url); el.textContent = 'Link copiado'; }
    catch(e){ el.textContent = url; }
    setTimeout(() => { if(el.isConnected) el.textContent = 'Copiar link do perfil'; }, 2500);
  }
});
const _nav = act.nav;
act.nav = d => { if(location.hash.startsWith('#jogador-')){ try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} } _nav(d); };

/* dica ao passar o dedo ou o mouse nas barras do gráfico */
const tip = document.createElement('div'); tip.id = 'tip'; tip.hidden = true; document.body.appendChild(tip);
function showTip(el, x, y){
  const [a, b, c] = el.dataset.tip.split('|');
  tip.innerHTML = `<span class="pc">${esc(a)}</span><b>${esc(b)}</b>${c ? `<span class="pc">${esc(c)}</span>` : ''}`;
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + 'px';
  tip.style.top = Math.max(8, y - h - 14) + 'px';
}
document.addEventListener('pointermove', e => { const h = e.target.closest && e.target.closest('.hit'); if(h) showTip(h, e.clientX, e.clientY); else if(!tip.hidden && e.pointerType === 'mouse') tip.hidden = true; });
document.addEventListener('pointerdown', e => { const h = e.target.closest && e.target.closest('.hit'); if(h){ showTip(h, e.clientX, e.clientY); } else tip.hidden = true; });
addEventListener('scroll', () => { tip.hidden = true; }, { passive:true });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && state.view === 'partida' && state.live) keepAwake(); });

pickLive();
render();
routeHash();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { const nav = $('#nav'); nav.classList.add('noanim'); moveInd(); requestAnimationFrame(() => nav.classList.remove('noanim')); });
store.init();
})();
</script>
